; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:black_f407ve]
platform = ststm32
board = genericSTM32F407VET6
framework = arduino

; 烧录方式：ST-Link（SWD 四线：3.3V / SWDIO / SWCLK / GND）
upload_protocol = stlink
debug_tool = stlink

; ★★★ 重要：必须配置 upload_speed = 1000，把 SWD 时钟降到 1MHz ★★★
; 这块 INMOP FOC 板是软开关机，SWD 时钟太快会导致烧录/复位瞬间通信不稳，
; 现象是复位后 HardFault / "Polling failed" / 无法烧录。降到 1MHz 后稳定。
upload_speed = 1000

; SimpleFOC v2.4.0 尚未适配 STM32duino 3.0.0 的新 HardwareTimer API，
; 这里固定使用 STM32duino 2.12.0（framework-arduinoststm32 4.21200.0），
; 避免 enableTimerClock(TIM_TypeDef*) 等编译错误。
platform_packages =
  framework-arduinoststm32@~4.21200.0

lib_deps =
  askuric/Simple FOC@^2.4.0
lib_archive = false
monitor_speed = 115200